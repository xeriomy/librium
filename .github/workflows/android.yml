name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Gradle build cache + configuration cache; the big warm-run win.
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest runners already ship the Android SDK; install API 36
      # only when missing (sdkmanager spin-up is slow).
      - name: Install Android platform packages
        run: |
          SDK="$ANDROID_HOME"
          if [ -z "$SDK" ]; then SDK="$ANDROID_SDK_ROOT"; fi
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          if [ ! -d "$SDK/platforms/android-36" ]; then
            sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
            (yes || true) | sdkmanager --licenses > /dev/null || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # One Gradle invocation for both: saves a full configuration +
      # daemon warmup versus separate steps, with identical semantics
      # (a test failure still skips lint, same as before).
      - name: Run unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: librium-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
