name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ubuntu-latest runners already ship the Android SDK; just ensure API 36 is present.
      - name: Install Android platform packages
        run: |
          SDK="$ANDROID_HOME"
          if [ -z "$SDK" ]; then SDK="$ANDROID_SDK_ROOT"; fi
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          (yes || true) | sdkmanager --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace
